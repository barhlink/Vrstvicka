<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vrstvička — nauč se nastavit 3D tiskárnu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:        #FBF7EC;
    --bg-soft:   #EEF6DC;
    --paper:     #FFFDF4;
    --ink:       #1F2A1A;
    --ink-2:     #4D5C44;
    --ink-3:     #7E8C73;
    --line:      rgba(31,42,26,.10);
    --line-2:    rgba(31,42,26,.06);

    --coral:     oklch(0.78 0.16 130);
    --coral-ink: oklch(0.42 0.12 135);
    --coral-soft:oklch(0.93 0.07 130);

    --sage:      oklch(0.72 0.085 165);
    --sage-ink:  oklch(0.42 0.08 168);
    --sage-soft: oklch(0.94 0.035 165);

    --amber:     oklch(0.83 0.115 85);
    --amber-ink: oklch(0.48 0.10 80);
    --amber-soft:oklch(0.95 0.045 85);

    --berry:     oklch(0.70 0.13 0);
    --berry-soft:oklch(0.94 0.04 5);

    --shadow-1: 0 1px 0 rgba(255,255,255,.6) inset, 0 1px 2px rgba(41,34,26,.04);
    --shadow-2: 0 1px 0 rgba(255,255,255,.7) inset, 0 6px 24px -10px rgba(41,34,26,.18), 0 2px 4px rgba(41,34,26,.05);
    --shadow-3: 0 1px 0 rgba(255,255,255,.7) inset, 0 24px 60px -28px rgba(41,34,26,.35), 0 4px 12px rgba(41,34,26,.06);

    --r-sm: 10px;
    --r-md: 16px;
    --r-lg: 22px;
    --r-xl: 32px;
    --r-2xl:44px;

    --display: 'Bricolage Grotesque', ui-serif, Georgia, serif;
    --body:    'DM Sans', ui-sans-serif, system-ui, sans-serif;
    --mono:    'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
  }

  *,*::before,*::after{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: var(--body);
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-feature-settings: "ss01","ss02","cv11";
    line-height: 1.5;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(1200px 600px at 90% -10%, oklch(0.93 0.04 45 / .55), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, oklch(0.94 0.025 165 / .45), transparent 60%);
  }
  #root{ position:relative; z-index:1; }

  h1,h2,h3,h4{
    font-family: var(--display);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 0;
    text-wrap: balance;
  }
  h1{ font-size: clamp(40px, 6vw, 80px); font-weight:700; letter-spacing:-0.035em; }
  h2{ font-size: clamp(28px, 3.4vw, 44px); }
  h3{ font-size: clamp(20px, 2vw, 26px); }
  p{ text-wrap: pretty; margin: 0; }

  ::selection{ background: oklch(0.85 0.13 42 / .55); }

  .btn{
    --bg: var(--ink);
    --fg: var(--paper);
    appearance:none; border:0; cursor:pointer;
    font-family: var(--body); font-weight:600;
    background: var(--bg); color: var(--fg);
    padding: 14px 22px; border-radius: 999px;
    font-size: 16px; letter-spacing: -0.005em;
    display:inline-flex; align-items:center; gap:10px;
    box-shadow: var(--shadow-1);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:hover{ transform: translateY(-1px); box-shadow: var(--shadow-2); }
  .btn:active{ transform: translateY(0); }
  .btn--primary{ --bg: var(--ink); --fg: #FFF8E7; }
  .btn--coral  { --bg: var(--coral); --fg: #fff; }
  .btn--ghost  { --bg: transparent; --fg: var(--ink); border: 1px solid var(--line); }
  .btn--ghost:hover{ background: var(--bg-soft); }
  .btn--lg{ padding: 18px 28px; font-size: 17px; }
  .btn--sm{ padding: 9px 14px; font-size: 14px; }

  .card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-1);
  }

  .chip{
    display:inline-flex; align-items:center; gap:6px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px;
    background: var(--bg-soft); color: var(--ink-2);
    border: 1px solid var(--line-2);
  }
  .chip--coral{ background: var(--coral-soft); color: var(--coral-ink); }
  .chip--sage { background: var(--sage-soft);  color: var(--sage-ink); }
  .chip--amber{ background: var(--amber-soft); color: var(--amber-ink); }

  .wrap{ max-width: 1180px; margin: 0 auto; padding: 0 28px; }
  @media (max-width: 640px){ .wrap{ padding: 0 18px; } }

  .nav{
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    background: rgba(251,245,236,.78);
    border-bottom: 1px solid var(--line-2);
  }
  .nav__inner{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 0;
  }
  .brand{
    display:inline-flex; align-items:center; gap:10px;
    font-family: var(--display); font-weight: 700; font-size: 22px;
    letter-spacing: -0.02em; color: var(--ink);
    text-decoration: none;
  }
  .brand:hover{ color: var(--coral-ink); }
  .nav__links{ display:flex; gap: 4px; align-items:center; }
  .nav__link{
    appearance:none; border:0; background:transparent; cursor:pointer;
    font-family: var(--body); font-weight: 500; font-size: 15px;
    color: var(--ink-2); padding: 9px 14px; border-radius: 999px;
    display:inline-flex; align-items:center; gap:8px;
  }
  .nav__link:hover{ background: var(--bg-soft); color: var(--ink); }
  .nav__link[aria-current="true"]{ background: var(--ink); color: #FFF8E7; }
  .nav__link[aria-current="true"]:hover{ background: var(--ink); color: #FFF8E7; }

  .steps{
    display: inline-flex; gap: 6px; padding: 6px;
    background: var(--bg-soft); border-radius: 999px; border: 1px solid var(--line-2);
  }
  .step{
    font-family: var(--mono); font-size: 11px; letter-spacing: .04em;
    padding: 6px 11px; border-radius: 999px; color: var(--ink-3);
    display:inline-flex; align-items:center; gap:6px;
  }
  .step--done{ color: var(--sage-ink); }
  .step--active{ background: var(--paper); color: var(--ink); box-shadow: var(--shadow-1); }
  .step__num{
    width:18px; height:18px; border-radius: 999px; background: var(--paper);
    border:1px solid var(--line); display:inline-flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:600;
  }
  .step--done .step__num{ background: var(--sage-soft); border-color: transparent; color: var(--sage-ink); }
  .step--active .step__num{ background: var(--ink); color: #FFF8E7; border-color: transparent; }

  .choice{
    appearance:none; cursor:pointer; text-align:left;
    background: var(--paper); border: 1.5px solid var(--line);
    border-radius: var(--r-lg); padding: 18px;
    display:flex; flex-direction:column; gap:8px;
    font-family: var(--body); color: var(--ink);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
    box-shadow: var(--shadow-1);
    width: 100%;
  }
  .choice:hover{ transform: translateY(-2px); border-color: var(--ink-3); box-shadow: var(--shadow-2); }
  .choice[aria-pressed="true"]{
    border-color: var(--ink); background: #FFFCF0;
    box-shadow: 0 0 0 3px var(--coral-soft), var(--shadow-2);
  }
  .choice__hd{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .choice__name{ font-family: var(--display); font-weight:600; font-size: 20px; letter-spacing:-0.01em; }
  .choice__sub{ color: var(--ink-3); font-size: 13px; font-family: var(--mono); }
  .choice__desc{ font-size: 13px; color: var(--ink-2); line-height: 1.45; }

  @keyframes fadeUp { 0% { opacity:0; transform: translateY(8px); } 100% { opacity:1; transform:none; } }
  .fade-up{ opacity: 1; animation: fadeUp .42s cubic-bezier(.2,.7,.2,1) backwards; }
  .fade-up--delay-1{ animation-delay: .05s; }
  .fade-up--delay-2{ animation-delay: .12s; }
  .fade-up--delay-3{ animation-delay: .2s; }
  @media (prefers-reduced-motion: reduce){ .fade-up{ animation: none; } }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1); opacity:.6; }
    50%      { transform: scale(1.4); opacity:1; }
  }

  .divider{ height:1px; background: var(--line-2); margin: 24px 0; border:0; }
  .pad-top{ padding-top: 56px; }
  @media (max-width:640px){ .pad-top{ padding-top: 28px; } }

  .grid-3{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .grid-2{ display:grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  @media (max-width: 720px){ .grid-3{ grid-template-columns: 1fr; } .grid-2{ grid-template-columns: 1fr; } }

  .dot{ width: 8px; height: 8px; border-radius: 999px; display:inline-block; }
  .visually-hidden{ position:absolute; clip: rect(0 0 0 0); width:1px; height:1px; overflow:hidden; }
  :focus-visible{ outline: 3px solid oklch(0.85 0.13 42 / .55); outline-offset: 2px; border-radius: 4px; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- tweaks-panel -->
  <script type="text/babel">

const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    transform:scale(var(--dc-inv-zoom,1));transform-origin:bottom right;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}
  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;
    border-radius:999px;background:rgba(0,0,0,.12);outline:none}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;background:#fff;
    border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;
    background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2;overflow-wrap:anywhere}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-chips{display:flex;gap:6px}
  .twk-chip{position:relative;appearance:none;flex:1;min-width:0;height:46px;
    padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;
    box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);
    transition:transform .12s cubic-bezier(.3,.7,.4,1),box-shadow .12s}
  .twk-chip:hover{transform:translateY(-1px);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.15)}
  .twk-chip>span{position:absolute;top:0;bottom:0;right:0;width:34%;
    display:flex;flex-direction:column;box-shadow:-1px 0 0 rgba(0,0,0,.1)}
  .twk-chip>span>i{flex:1;box-shadow:0 -1px 0 rgba(0,0,0,.1)}
  .twk-chip>span>i:first-child{box-shadow:none}
  .twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" value={value} onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>{sup.map((c, j) => <i key={j} style={{ background: c }} />)}</span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakColor,
});

function Printer3D({ progress = 0, material = 'PLA', infill = 'medium', speed = 'slow', running = false, item = null }) {
  const layerColor = matColor(material);
  const objBox = { x: 100, y: 90, w: 80, h: 100 };
  const oscRange = objBox.w * 0.45;
  const nozzleX = (objBox.x + objBox.w/2) + Math.sin(progress * Math.PI * (speed === 'fast' ? 18 : 10)) * oscRange;
  const revealH = Math.max(0.0001, progress * objBox.h);
  const revealY = objBox.y + objBox.h - revealH;
  const nozzleY = Math.max(78, revealY - 6);
  const layerSpacing = 6;
  const layersDone = Math.floor(progress * (objBox.h / layerSpacing));
  const uid = item?.id || 'item';
  const clipId = `printclip-${uid}`;

  return (
    <svg viewBox="0 0 280 240" width="100%" style={{ display:'block' }} aria-label="3D tiskárna při tisku">
      <defs>
        <linearGradient id="printerFrame" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor="#3a3128" />
          <stop offset="1" stopColor="#27201a" />
        </linearGradient>
        <linearGradient id="bedGrad" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stopColor="#FFFCF6" />
          <stop offset="1" stopColor="#E8DFCD" />
        </linearGradient>
        <clipPath id={clipId}>
          <rect x={objBox.x - 4} y={revealY} width={objBox.w + 8} height={revealH + 1} />
        </clipPath>
      </defs>
      <ellipse cx="140" cy="225" rx="100" ry="6" fill="rgba(41,34,26,.10)" />
      <rect x="34"  y="30" width="10" height="170" rx="4" fill="url(#printerFrame)" />
      <rect x="236" y="30" width="10" height="170" rx="4" fill="url(#printerFrame)" />
      <rect x="34"  y="22" width="212" height="14" rx="6" fill="url(#printerFrame)" />
      <rect x="200" y="45" width="40" height="26" rx="5" fill="#1c1612" />
      <rect x="204" y="49" width="32" height="18" rx="3" fill={layerColor} opacity=".5" />
      <text x="220" y="61" textAnchor="middle" fontFamily="JetBrains Mono, monospace" fontSize="9" fill="#FFF8E7" fontWeight="600">
        {Math.round(progress * 100)}%
      </text>
      <rect x="44" y="62" width="192" height="6" rx="3" fill="#1c1612" />
      {item && (
        <g opacity=".18">
          <text x={objBox.x + objBox.w/2} y={objBox.y + objBox.h - 4}
                fontSize={objBox.h * 0.95} textAnchor="middle"
                style={{ filter: 'grayscale(1)' }}>
            {item.emoji}
          </text>
        </g>
      )}
      {item && (
        <g clipPath={`url(#${clipId})`}>
          <text x={objBox.x + objBox.w/2} y={objBox.y + objBox.h - 4}
                fontSize={objBox.h * 0.95} textAnchor="middle">
            {item.emoji}
          </text>
          <rect x={objBox.x - 4} y={objBox.y - 4} width={objBox.w + 8} height={objBox.h + 8}
                fill={layerColor} opacity=".22" style={{ mixBlendMode: 'multiply' }} />
          {Array.from({ length: layersDone + 1 }).map((_, i) => (
            <line key={i}
                  x1={objBox.x - 4} x2={objBox.x + objBox.w + 4}
                  y1={objBox.y + objBox.h - i * layerSpacing}
                  y2={objBox.y + objBox.h - i * layerSpacing}
                  stroke={layerColor}
                  strokeWidth={speed === 'fast' ? 1.4 : 0.6}
                  opacity={speed === 'fast' ? 0.55 : 0.28} />
          ))}
        </g>
      )}
      {running && progress > 0.02 && (
        <line x1={nozzleX} y1={nozzleY + 6} x2={nozzleX} y2={revealY + 1}
              stroke={layerColor} strokeWidth="1.6" opacity=".85" strokeLinecap="round" />
      )}
      <g transform={`translate(${nozzleX} ${Math.max(0, nozzleY - 50)})`}>
        <rect x="-12" y="0"  width="24" height="36" rx="4" fill="#1c1612" />
        <rect x="-9"  y="4"  width="18" height="6"  rx="2" fill={layerColor} />
        <polygon points="-6,36 6,36 0,50" fill="#1c1612" />
        <circle cx="0" cy="50" r="2.2" fill={layerColor} />
      </g>
      <rect x="50" y="195" width="180" height="8" rx="2" fill="#2a221c" />
      <rect x="56" y="190" width="168" height="6" rx="2" fill="url(#bedGrad)" />

];

];

function evaluatePrint(item, config) {
  const o = item.optimal;
  const hits = ['material','infill','speed'].filter(k => o[k] === config[k]).length;
  if (hits === 3) return { score:3, kind:'great', title:'Skvěle! Vyšlo to.', body:'Všechno sedí — materiál, výplň i rychlost. Tisk je pevný a hezký.' };
  if (hits === 2) return { score:2, kind:'ok',    title:'Funguje to, ale jde to líp.', body:'Skoro! Jedna věc se ještě dá vylepšit.' };
  if (hits === 1) return { score:1, kind:'meh',   title:'Hmm, není to ono.', body:'Funkce kulhá. Zkus změnit nastavení a porovnat.' };
  return                  { score:0, kind:'fail', title:'Tohle se nepovedlo.', body:'Tiskárna sice tiskne, ale výsledek nesedí. Zkus to jinak.' };
}

  'stojanek-tel':'PETG je tužší než PLA — telefon stojí pevně.',
  vesak:    'Plná výplň zpevní stěny kolem šroubu. Klíče nepadají.',

  zkumavky: 'PETG odolá chemikáliím — laborka mu nedá. PLA by reagoval.',
  puzzle:   'Pomalý tisk = přesné okraje. Dílky pak hezky pasují.',
  pravitko: 'Pomalu tištěné dílky = přesné mm. Tužší materiál se neprohne.',
  raketka:  'Dekorace nic nenese — dutá výplň ušetří plast i čas.',
  krmitko:  'PETG vydrží mráz i déšť. PLA by venku za zimu zvlhl a praskl.',
  visacka:  'PETG nežloutne na slunci. Hodí se na cokoli ven.',
  hmyz:     'Plná výplň + PETG = roky venku bez prasklin.',
  leknin:   'TPU plave a vlní se s vodou. Skvěle imituje skutečný leknín.',
  seminka:  'PETG drží suchá semínka i ve vlhkém skleníku.',
  pouzdro:  'TPU pohlcuje nárazy. Telefon pád přežije.',
  kabely:   'TPU se rozevře a zase zacvakne — ideální pro klipy.',
  mys:      'TPU se přizpůsobí zápěstí. Po hodině práce nic nebolí.',
  ozubeni:  'Pomalu = přesný tvar zubu. PETG se brzy neopotřebí.',
  vypinac:  'PLA dává hladký povrch a přesné rozměry pro šrouby.',
};

Object.assign(window, {
  GROUPS, MATERIALS, INFILLS, SPEEDS, PREDICTIONS, REFLECTIONS, TIPS,
  evaluatePrint, matLabel, matFull, infillLabel, speedLabel, matColor,
});
  </script>

function StepHeader({ step }) {

              <span className="step__num">{done ? '✓' : i + 1}</span>
              {label}
            </span>
          );
        })}
      </div>
    </div>
  );
}

function DidYouKnow({ entries }) {
  const [idx, setIdx] = useState(0);

  // Collect unique unlocked tips from diary entries (preserve discovery order, newest first)
  const unlocked = [];
  const seen = new Set();
  [...entries].forEach(e => {
    const tip = TIPS[e.item.id];
    if (tip && !seen.has(e.item.id)) {
      seen.add(e.item.id);
      unlocked.push({ tip, item: e.item });
    }
  });

  const total = unlocked.length;
  const safeIdx = total > 0 ? idx % total : 0;
  const current = unlocked[safeIdx];

  const prev = () => setIdx(i => (i - 1 + total) % total);
  const next = () => setIdx(i => (i + 1) % total);

  return (
    <div style={{ marginTop: 52 }}>
      <div style={{ display:'flex', alignItems:'center', gap: 12, marginBottom: 18 }}>
        <span className="chip chip--amber">✦ Víš, že…</span>

        <div className="card fade-up" style={{ padding: 32, display:'flex', gap: 24, alignItems:'center', background:'var(--paper)' }}>

              Prozkoumej první předmět a odemkneš první zajímavost o 3D tisku.
            </p>
          </div>
        </div>
      ) : (
        <div className="card fade-up" style={{ padding: 28, position:'relative', overflow:'hidden' }}>
          <div style={{
            position:'absolute', inset:0,
            background:'radial-gradient(500px 300px at 90% 110%, var(--amber-soft), transparent 60%)',
            pointerEvents:'none',
          }} />
          <div style={{ position:'relative', display:'grid', gridTemplateColumns:'1fr auto', gap: 20, alignItems:'center' }}>
            <div>
              <div style={{ display:'flex', alignItems:'center', gap: 10, marginBottom: 12 }}>
                <div style={{
                  width: 40, height: 40, borderRadius: 12, background:'var(--bg-soft)',
                  display:'flex', alignItems:'center', justifyContent:'center', fontSize: 20, flexShrink: 0,
                }}>{current.item.emoji}</div>
                <span style={{ fontFamily:'var(--mono)', fontSize: 11, color:'var(--ink-3)', letterSpacing:'.06em', textTransform:'uppercase' }}>
                  {current.item.name}
                </span>
              </div>
              <p style={{ fontSize: 17, color:'var(--ink)', lineHeight: 1.55, fontWeight: 500 }}>
                {current.tip}
              </p>
            </div>
            {total > 1 && (
              <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap: 8, flexShrink: 0 }}>
                <button className="btn btn--ghost btn--sm" onClick={prev}
                        style={{ padding:'8px 12px', fontSize: 18, lineHeight: 1 }}>‹</button>
                <span style={{ fontFamily:'var(--mono)', fontSize: 11, color:'var(--ink-3)', whiteSpace:'nowrap' }}>
                  {safeIdx + 1} / {total}
                </span>
                <button className="btn btn--ghost btn--sm" onClick={next}
                        style={{ padding:'8px 12px', fontSize: 18, lineHeight: 1 }}>›</button>
              </div>
            )}
          </div>
          {total > 1 && (
            <div style={{ display:'flex', gap: 5, marginTop: 18, justifyContent:'center' }}>
              {unlocked.map((_, i) => (
                <button key={i} onClick={() => setIdx(i)}
                        style={{
                          width: i === safeIdx ? 20 : 6, height: 6, borderRadius: 999, border: 0, padding: 0, cursor:'pointer',

  );

  );

                <button key={s.id} className="choice" aria-pressed={config.speed === s.id}
                        onClick={() => setConfig({ ...config, speed: s.id })}>
                  <div style={{ display:'flex', alignItems:'center', gap: 12 }}>
                    <span style={{ fontSize: 26 }}>{s.id === 'slow' ? '🐢' : '🐇'}</span>
                    <div style={{ display:'flex', flexDirection:'column' }}>
                      <span className="choice__name" style={{ fontSize: 18 }}>{s.name}</span>
                      <span className="choice__sub">{s.label}</span>
                    </div>
                  </div>
                  <div className="choice__desc">{s.desc}</div>
                </button>
              ))}
            </div>
          </div>

          <div style={{ display:'flex', justifyContent:'space-between', marginTop: 40, gap: 12, flexWrap:'wrap' }}>
            <button className="btn btn--ghost" onClick={onBack}>← Vybrat jiný předmět</button>
            <button className="btn btn--primary btn--lg" onClick={onNext} disabled={!ready}
                    style={{ opacity: ready ? 1 : .4, cursor: ready ? 'pointer' : 'not-allowed' }}>
              Pokračovat na predikci →
            </button>
          </div>
        </div>
        <aside style={{ position:'sticky', top: 90 }}>
          <ConfigPreview item={item} group={group} config={config} />
        </aside>
      </div>
      <style>{`@media (max-width: 920px){ #config-grid { grid-template-columns: 1fr !important; } #config-grid aside { position: static !important; } }`}</style>
    </section>
  );
}

function PredictScreen({ item, group, config, prediction, setPrediction, onNext, onBack }) {
  return (
    <section className="pad-top" style={{ paddingBottom: 80 }}>
      <StepHeader step={2} />
      <div className="fade-up" style={{ maxWidth: 760, margin:'0 auto', textAlign:'center' }}>
        <Vrstvicka size={120} tone={group.accent} mood="happy" />
        <h2 style={{ marginTop: 8 }}>Co myslíš, že se stane?</h2>
        <p style={{ fontSize: 17, color:'var(--ink-2)', marginTop: 10 }}>
          Tipni si, jestli ti tahle kombinace pro <strong>{item.name.toLowerCase()}</strong> bude fungovat.
          Žádný strach — i špatný tip nás něco naučí.
        </p>
      </div>
      <div className="fade-up fade-up--delay-1" style={{ marginTop: 30, display:'flex', justifyContent:'center', flexWrap:'wrap', gap: 14 }}>
        {PREDICTIONS.map(p => (
          <button key={p.id} aria-pressed={prediction === p.id} className="choice"
                  onClick={() => setPrediction(p.id)}
                  style={{ width: 220, alignItems:'center', textAlign:'center' }}>
            <div style={{ fontSize: 40 }}>{p.icon}</div>
            <div className="choice__name" style={{ fontSize: 18 }}>{p.label}</div>
          </button>
        ))}
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', marginTop: 50, gap: 12, maxWidth: 760, margin:'40px auto 0' }}>
        <button className="btn btn--ghost" onClick={onBack}>← Upravit nastavení</button>
        <button className="btn btn--coral btn--lg" onClick={onNext} disabled={!prediction}
                style={{ opacity: prediction ? 1 : .4, cursor: prediction ? 'pointer' : 'not-allowed' }}>
          🖨️ Tisknout!
        </button>
      </div>
    </section>
  );
}

function ProgressBar({ progress, color }) {
  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', fontFamily:'var(--mono)', fontSize: 11, letterSpacing:'.06em', textTransform:'uppercase', color:'var(--ink-3)' }}>
        <span>Průběh tisku</span>
        <span style={{ color:'var(--ink)' }}>{Math.round(progress * 100)} %</span>
      </div>
      <div style={{ height: 10, background:'var(--bg-soft)', borderRadius: 999, marginTop: 8, overflow:'hidden' }}>
        <div style={{ height:'100%', width: `${progress * 100}%`, background: color, borderRadius: 999, transition: 'width 80ms linear' }} />
      </div>
    </div>
  );
}

function Stat({ label, value, dot }) {
  return (
    <div>
      <div style={{ fontFamily:'var(--mono)', fontSize: 10, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--ink-3)' }}>{label}</div>
      <div style={{ marginTop: 4, fontWeight: 600, fontSize: 14, display:'flex', alignItems:'center', gap: 8 }}>
        {dot && <span className="dot" style={{ background: dot }} />}
        {value}
      </div>
    </div>
  );
}

function PrintScreen({ item, group, config, onDone, onCancel }) {
  const [progress, setProgress] = useState(0);
  const [running, setRunning]   = useState(true);
  const startedAt = useRef(performance.now());
  const total = config.speed === 'fast' ? 4500 : 7000;

  useEffect(() => {
    if (!running) return;
    let raf;
    const tick = () => {
      const t = (performance.now() - startedAt.current) / total;
      const p = Math.min(1, t);
      setProgress(p);
      if (p < 1) raf = requestAnimationFrame(tick);
      else setTimeout(() => onDone(), 600);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [running]);

  const pct = Math.round(progress * 100);

  return (
    <section className="pad-top" style={{ paddingBottom: 80 }}>
      <StepHeader step={3} />
      <div style={{ display:'grid', gridTemplateColumns:'1.1fr 1fr', gap: 36, alignItems:'center' }} id="print-grid">
        <div className="card fade-up" style={{ padding: 24, position:'relative', overflow:'hidden', background: '#1c1612' }}>
          <div style={{ position:'absolute', inset:0, background:'radial-gradient(circle at 50% 30%, rgba(255,200,150,.18), transparent 60%)' }} />
          <div style={{ position:'relative' }}>
            <Printer3D progress={progress} material={config.material} infill={config.infill} speed={config.speed} running={running} item={item} />
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop: 10, color:'#FFF8E7', fontFamily:'var(--mono)', fontSize: 12, letterSpacing:'.06em' }}>
              <span style={{ display:'inline-flex', alignItems:'center', gap: 8 }}>
                <span style={{ width:8, height:8, borderRadius:999, background: matColor(config.material), animation:'pulseDot 1.2s infinite' }} />
                VRSTVIČKA 3000 — TISK PROBÍHÁ
              </span>
              <span>{pct}%</span>
            </div>
          </div>
        </div>
        <div className="fade-up fade-up--delay-1">
          <span className={`chip chip--${group.accent}`}>{item.name}</span>
          <h2 style={{ marginTop: 14 }}>Tiskneme!</h2>
          <p style={{ fontSize: 16, color:'var(--ink-2)', marginTop: 10 }}>Tiskárna pokládá vrstvu po vrstvě. Pomalu — nebo rychle, podle tvého nastavení.</p>
          <div className="card" style={{ padding: 18, marginTop: 24 }}>
            <ProgressBar progress={progress} color={matColor(config.material)} />
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap: 12, marginTop: 18 }}>
              <Stat label="Materiál"  value={`${matFull(config.material)} · ${matLabel(config.material)}`} dot={matColor(config.material)} />
              <Stat label="Výplň"     value={infillLabel(config.infill)} />
              <Stat label="Rychlost"  value={speedLabel(config.speed)} />
            </div>
          </div>
          <div style={{ display:'flex', gap: 10, marginTop: 18 }}>
            <button className="btn btn--ghost btn--sm" onClick={onCancel}>⏹ Zastavit</button>
            <button className="btn btn--ghost btn--sm" onClick={() => { startedAt.current = performance.now(); setProgress(0); }}>↻ Znovu</button>
          </div>
        </div>
      </div>
      <style>{`@media (max-width: 920px){ #print-grid { grid-template-columns: 1fr !important; } }`}</style>
    </section>
  );
}

function CompareRow({ label, picked, ok, optimal }) {
  return (
    <div style={{ padding: 12, borderRadius: 12, background:'var(--bg-soft)', border:'1px solid var(--line-2)' }}>
      <div style={{ fontFamily:'var(--mono)', fontSize: 10, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--ink-3)' }}>{label}</div>
      <div style={{ marginTop: 4, fontWeight: 600, display:'flex', justifyContent:'space-between', alignItems:'center', gap: 6 }}>
        <span>{picked}</span>
        {ok === true  && <span style={{ color:'var(--sage-ink)', fontSize: 13 }}>✓</span>}
        {ok === false && <span style={{ color:'var(--coral-ink)', fontSize: 11 }}>↳ {optimal}</span>}
      </div>
    </div>
  );
}

function ResultScreen({ item, group, config, prediction, onSave, onAgain, onHome }) {
  const result = evaluatePrint(item, config);
  const [reflection, setReflection] = useState(null);
  const tone = result.score === 3 ? 'sage' : result.score === 2 ? 'amber' : 'coral';
  const tip = TIPS[item.id];

  const save = () => {
    onSave({ item, group, config, prediction, result, reflection, when: Date.now() });
  };

  return (
    <section className="pad-top" style={{ paddingBottom: 80 }}>
      <StepHeader step={4} />
      <div className="fade-up" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: 36, alignItems:'flex-start' }} id="res-grid">
        <div className="card" style={{ padding: 28, position:'relative', overflow:'hidden' }}>
          <div style={{ position:'absolute', inset:0, background: `radial-gradient(220px 160px at 100% 0%, var(--${tone}-soft), transparent 60%)` }} />
          <div style={{ position:'relative' }}>
            <span className={`chip chip--${tone}`} style={{ marginBottom: 12 }}>
              {result.score === 3 ? '★ ★ ★ skvělé' : result.score === 2 ? '★ ★ ☆ dobré' : result.score === 1 ? '★ ☆ ☆ jde to lépe' : '☆ ☆ ☆ zkus jinak'}
            </span>
            <h2 style={{ marginTop: 6 }}>{result.title}</h2>
            <p style={{ marginTop: 10, fontSize: 16, color:'var(--ink-2)' }}>{result.body}</p>
            <div style={{ marginTop: 24, display:'grid', gridTemplateColumns:'1fr 1fr', gap: 14 }}>
              <CompareRow label="Materiál"  picked={matLabel(config.material)} ok={item.optimal.material === config.material} optimal={matLabel(item.optimal.material)} />
              <CompareRow label="Výplň"     picked={infillLabel(config.infill)} ok={item.optimal.infill === config.infill} optimal={infillLabel(item.optimal.infill)} />
              <CompareRow label="Rychlost"  picked={speedLabel(config.speed)} ok={item.optimal.speed === config.speed} optimal={speedLabel(item.optimal.speed)} />
              <CompareRow label="Tvůj tip"  picked={PREDICTIONS.find(p => p.id === prediction)?.label || '—'} ok={null} optimal="" />
            </div>
            <div style={{ marginTop: 24, padding: 16, borderRadius: 16, background: 'var(--bg-soft)', border:'1px dashed var(--line)' }}>
              <div style={{ display:'flex', alignItems:'center', gap: 10, color:'var(--ink-3)', fontFamily:'var(--mono)', fontSize: 11, letterSpacing:'.08em', textTransform:'uppercase' }}>✦ Víš, že…</div>
              <p style={{ marginTop: 8 }}>{tip}</p>
            </div>
          </div>
        </div>
        <div>
          <h3>🔍 Jak to dopadlo?</h3>
          <p style={{ color:'var(--ink-2)', marginTop: 8 }}>Krátké zamyšlení nakonec — co tě překvapilo, co bys změnil/a?</p>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: 12, marginTop: 18 }}>
            {REFLECTIONS.map(r => (
              <button key={r.id} aria-pressed={reflection === r.id} className="choice"
                      onClick={() => setReflection(r.id)}
                      style={{ flexDirection:'row', alignItems:'center', gap: 12, padding: 14 }}>
                <span style={{ fontSize: 28 }}>{r.icon}</span>
                <span className="choice__name" style={{ fontSize: 16 }}>{r.label}</span>
              </button>
            ))}
          </div>
          <div style={{ display:'flex', gap: 10, marginTop: 26, flexWrap:'wrap' }}>
            <button className="btn btn--primary btn--lg" disabled={!reflection}
                    style={{ opacity: reflection ? 1 : .4, cursor: reflection ? 'pointer' : 'not-allowed' }}
                    onClick={save}>
              📓 Zapsat do deníku
            </button>
            <button className="btn btn--ghost" onClick={onAgain}>↻ Zkusit jinak</button>
            <button className="btn btn--ghost" onClick={onHome}>Prozkoumat něco jiného →</button>
          </div>
        </div>
      </div>
      <style>{`@media (max-width: 920px){ #res-grid { grid-template-columns: 1fr !important; } }`}</style>
    </section>
  );
}

function DiaryCard({ e, index }) {
  const tone = e.result.score === 3 ? 'sage' : e.result.score === 2 ? 'amber' : 'coral';
  const time = new Date(e.when).toLocaleString('cs-CZ', { dateStyle: 'short', timeStyle: 'short' });
  return (
    <div className="card" style={{ padding: 22, position:'relative', overflow:'hidden' }}>
      <div style={{ position:'absolute', top: 0, right: 0, padding:'8px 14px', background: `var(--${tone}-soft)`, color: `var(--${tone}-ink)`, borderBottomLeftRadius: 14, fontFamily:'var(--mono)', fontSize: 11, letterSpacing:'.06em' }}>
        #{String(index).padStart(2, '0')}
      </div>
      <div style={{ display:'flex', alignItems:'center', gap: 12 }}>
        <div style={{ width: 52, height: 52, borderRadius: 14, background:'var(--bg-soft)', display:'flex', alignItems:'center', justifyContent:'center', fontSize: 26 }}>{e.item.emoji}</div>
        <div>
          <div style={{ fontFamily:'var(--display)', fontWeight: 600, fontSize: 20 }}>{e.item.name}</div>
          <div style={{ fontFamily:'var(--mono)', fontSize: 11, color:'var(--ink-3)', letterSpacing:'.06em' }}>{time}</div>
        </div>
      </div>
      <div style={{ display:'flex', gap: 6, marginTop: 14, flexWrap:'wrap' }}>
        <span className="chip"><span className="dot" style={{ background: matColor(e.config.material) }} />{matLabel(e.config.material)}</span>
        <span className="chip">{infillLabel(e.config.infill)}</span>
        <span className="chip">{speedLabel(e.config.speed)}</span>
      </div>
      <p style={{ marginTop: 12, fontWeight: 600 }}>{e.result.title}</p>
      <p style={{ color:'var(--ink-2)', fontSize: 14, marginTop: 4 }}>{e.result.body}</p>
      <div style={{ display:'flex', gap: 10, marginTop: 14, fontSize: 13, color:'var(--ink-3)' }}>
        <span>Tip: <strong style={{ color:'var(--ink-2)' }}>{PREDICTIONS.find(p => p.id === e.prediction)?.label}</strong></span>
        <span>·</span>
        <span>Reflexe: <strong style={{ color:'var(--ink-2)' }}>{REFLECTIONS.find(r => r.id === e.reflection)?.label || '—'}</strong></span>
      </div>
    </div>
  );
}

function DiaryScreen({ entries, onClear, onStart }) {
  return (
    <section className="pad-top" style={{ paddingBottom: 80 }}>
      <div className="fade-up" style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', flexWrap:'wrap', gap: 16 }}>
        <div>
          <span className="chip chip--sage">📓 Badatelský deník</span>
          <h2 style={{ marginTop: 14 }}>Co jsi už zkusil/a?</h2>
          <p style={{ marginTop: 8, color:'var(--ink-2)', maxWidth: 560 }}>Každý pokus se sem zapíše. Můžeš se k němu vracet, porovnávat s novými a dívat se, co se podařilo.</p>
        </div>
        <div style={{ display:'flex', gap: 10 }}>
          <button className="btn btn--coral" onClick={onStart}>🔍 Nový pokus</button>
          {entries.length > 0 && <button className="btn btn--ghost btn--sm" onClick={onClear}>Vyčistit</button>}
        </div>
      </div>
      {entries.length === 0 ? (
        <div className="card fade-up fade-up--delay-1" style={{ marginTop: 36, padding: 56, textAlign:'center' }}>
          <Vrstvicka size={140} tone="sage" mood="wink" />
          <h3 style={{ marginTop: 12 }}>Zatím prázdno.</h3>
          <p style={{ marginTop: 8, color:'var(--ink-2)' }}>Vrať se na průzkum a vyzkoušej první předmět.</p>
          <div style={{ marginTop: 20 }}>
            <button className="btn btn--primary" onClick={onStart}>Začít první pokus →</button>
          </div>
        </div>
      ) : (
        <div className="grid-2 fade-up fade-up--delay-1" style={{ marginTop: 28 }}>
          {entries.map((e, i) => (
            <DiaryCard key={i} e={e} index={entries.length - i} />
          ))}
        </div>
      )}
    </section>
  );
}
  </script>

  <!-- app -->
  <script type="text/babel">

const { useState: useS, useEffect: useE } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": ["#86C44E", "#FBF7EC", "#1F2A1A"],
  "displayFont": "Bricolage Grotesque",
  "bodyFont": "DM Sans",
  "mascotTone": "green"
}/*EDITMODE-END*/;

const PALETTES = [
  ["#86C44E", "#FBF7EC", "#1F2A1A"],
  ["#E97A4F", "#FBF5EC", "#29221A"],
  ["#D9A24E", "#FAF3E2", "#2A2418"],
  ["#5B8FBE", "#F2F0EA", "#1A2129"],
];

const DISPLAY_FONTS = ["Bricolage Grotesque", "Instrument Serif", "Space Grotesk", "DM Serif Display"];
const BODY_FONTS    = ["DM Sans", "Manrope", "Public Sans", "Work Sans"];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  useE(() => {
    const root = document.documentElement;
    const [accent, bg, ink] = t.palette || PALETTES[0];
    root.style.setProperty('--coral', accent);
    root.style.setProperty('--bg', bg);
    root.style.setProperty('--ink', ink);
    root.style.setProperty('--display', `'${t.displayFont}', ui-serif, Georgia, serif`);
    root.style.setProperty('--body',    `'${t.bodyFont}', ui-sans-serif, system-ui, sans-serif`);
  }, [t.palette, t.displayFont, t.bodyFont]);

  const [route, setRoute] = useS({ name: 'home' });
  const [group, setGroup]       = useS(null);
  const [item, setItem]         = useS(null);
  const [config, setConfig]     = useS({ material:null, infill:null, speed:null });
  const [prediction, setPredict]= useS(null);
  const [entries, setEntries]   = useS(() => {
    try { return JSON.parse(localStorage.getItem('vrstvicka.diary') || '[]'); } catch { return []; }
  });

  const persist = (next) => {
    setEntries(next);
    try { localStorage.setItem('vrstvicka.diary', JSON.stringify(next)); } catch {}
  };

  const reset = () => {
    setItem(null); setGroup(null);
    setConfig({ material:null, infill:null, speed:null });
    setPredict(null);
  };

  const startExplore = () => { reset(); setRoute({ name: 'picker' }); };

  return (
    <>
      <nav className="nav">
        <div className="wrap nav__inner">
          <a href="#" className="brand" onClick={(e)=>{ e.preventDefault(); setRoute({ name: 'home' }); }}>
            <VrstvickaMini size={32} />
            <span>Vrstvička</span>
            <span style={{ fontFamily:'var(--mono)', fontSize: 11, color:'var(--ink-3)', fontWeight: 500, marginLeft: 6, letterSpacing:'.06em', textTransform:'uppercase' }}>3D tisk</span>
          </a>
          <div className="nav__links">
            <button className="nav__link" aria-current={route.name === 'home' ? 'true' : undefined} onClick={() => setRoute({ name: 'home' })}>Úvod</button>
            <button className="nav__link" aria-current={['picker','config','predict','print','result'].includes(route.name) ? 'true' : undefined} onClick={startExplore}>🔍 Průzkum</button>
            <button className="nav__link" aria-current={route.name === 'diary' ? 'true' : undefined} onClick={() => setRoute({ name: 'diary' })}>
              📓 Deník
              {entries.length > 0 && (
                <span style={{ marginLeft: 4, background:'var(--coral)', color:'#fff', fontSize: 11, fontWeight: 700, padding:'1px 7px', borderRadius: 999, fontFamily:'var(--mono)' }}>{entries.length}</span>
              )}
            </button>
          </div>
        </div>
      </nav>

      <main className="wrap">
        {route.name === 'home' && <HeroScreen attempts={entries.length} onStart={startExplore} onDiary={() => setRoute({ name: 'diary' })} />}
        {route.name === 'picker' && <PickerScreen onPick={(g, it) => { setGroup(g); setItem(it); setRoute({ name: 'config' }); }} onBack={() => setRoute({ name: 'home' })} entries={entries} />}
        {route.name === 'config' && item && <ConfigScreen item={item} group={group} config={config} setConfig={setConfig} onNext={() => setRoute({ name: 'predict' })} onBack={() => setRoute({ name: 'picker' })} />}
        {route.name === 'predict' && item && <PredictScreen item={item} group={group} config={config} prediction={prediction} setPrediction={setPredict} onNext={() => setRoute({ name: 'print' })} onBack={() => setRoute({ name: 'config' })} />}
        {route.name === 'print' && item && <PrintScreen item={item} group={group} config={config} onDone={() => setRoute({ name: 'result' })} onCancel={() => setRoute({ name: 'config' })} />}
        {route.name === 'result' && item && <ResultScreen item={item} group={group} config={config} prediction={prediction} onSave={(entry) => { const next = [entry, ...entries].slice(0, 30); persist(next); setRoute({ name: 'diary' }); }} onAgain={() => setRoute({ name: 'config' })} onHome={() => { reset(); setRoute({ name: 'picker' }); }} />}
        {route.name === 'diary' && <DiaryScreen entries={entries} onClear={() => persist([])} onStart={startExplore} />}
      </main>

      <footer style={{ borderTop:'1px solid var(--line-2)', padding:'34px 0 50px', marginTop: 40, color:'var(--ink-3)' }}>
        <div className="wrap" style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap: 14, fontSize: 14 }}>
          <span style={{ display:'inline-flex', alignItems:'center', gap: 10 }}>
            <VrstvickaMini size={26} />
            <span style={{ fontFamily:'var(--display)', fontWeight: 600, color:'var(--ink-2)' }}>Vrstvička</span>
            <span>· Badatelská dílna 3D tisku</span>
          </span>
          <span>Vyrobeno s ♥ pro zvídavé děti — © 2026</span>
        </div>
      </footer>

      <TweaksPanel>
        <TweakSection label="Vzhled" />
        <TweakColor label="Paleta (akcent / podklad / inkoust)" value={t.palette} options={PALETTES} onChange={(v) => setTweak('palette', v)} />
        <TweakSelect label="Display font" value={t.displayFont} options={DISPLAY_FONTS} onChange={(v) => setTweak('displayFont', v)} />
        <TweakSelect label="Body font" value={t.bodyFont} options={BODY_FONTS} onChange={(v) => setTweak('bodyFont', v)} />
        <TweakSection label="Maskot" />
        <TweakRadio label="Tón Vrstvičky" value={t.mascotTone} options={['green', 'coral', 'sage', 'amber']} onChange={(v) => setTweak('mascotTone', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
